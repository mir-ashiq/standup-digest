name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Manifest parse check
        run: node -e "const y=require('js-yaml');const fs=require('fs');y.load(fs.readFileSync('manifest.yml','utf8'));console.log('manifest.yml parses')" 2>/dev/null || node -e "const fs=require('fs');const s=fs.readFileSync('manifest.yml','utf8');if(!/modules:/.test(s)||!/app:/.test(s))process.exit(1);console.log('manifest.yml structure ok (js-yaml not installed)')"
